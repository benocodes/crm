# CORE69 D2, D25. `chat`, its adapters and the markdown and hast packages whose versions `chat` resolves move together, weekly.
# The `npm` entry sits at the workspace root, where the one `pnpm-lock.yaml` lives (#121 item 3).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      chat:
        patterns:
          - chat
          - '@chat-adapter/*'
          - unified
          - 'remark-*'
          - 'mdast-*'
          - 'hast-*'
          - '@types/mdast'
          - '@types/hast'
  # OPS237 P3: the workflow's actions are pinned to full commit SHAs; this keeps the pins (and their tag comments) current, weekly.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
