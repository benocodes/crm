name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: Exact steps, requests or payloads. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior, description: Include error text, status codes or logs. }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: Environment, description: Local, staging or production; package and version. }
