# [[OPS210]] D19, D25 / [[OPS237]]: on a push to main, `changesets/action` turns pending changesets into the "Version Packages" pull request (both package versions and
# both CHANGELOG.md files) and keeps it up to date. It has NO publish input: it never publishes, never tags and never releases. A person merges the PR (D24).
# The repository setting "Allow GitHub Actions to create and approve pull requests" must be on for it to open the PR (the user's, D25).
name: version

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Open or update the Version Packages pull request
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
