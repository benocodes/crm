# [[OPS210]] D19, D24 / [[OPS237]]: build and check the two release tarballs from a fresh checkout. Dispatch: upload them as a workflow artifact.
# The version is the fixed group of packages/cli and packages/server-d1 (changesets, version.yml); a tag must be v<version>. A `v*` tag: the same, then a DRAFT GitHub Release carrying exactly the two tarballs and SHA256SUMS. Nothing is published to npm; a person does that.
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check the tag against the release version
        run: pnpm release:ci tag
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test (every package but api, one at a time)
        run: pnpm -r --workspace-concurrency=1 --filter '!@vibase/api' test
      - name: Test (api)
        run: pnpm -C packages/api test --reporter=dot
      - name: Build
        run: pnpm -r build
      - name: The gate leaves the tree clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            echo "the gate changed or added files:"
            echo "$status"
            exit 1
          fi
      - name: Build the release
        run: pnpm release:build
      - name: Check the release
        run: pnpm release:check
      - name: List the release assets
        run: pnpm release:ci assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vibase-release
          path: |
            packages/release/dist/vibase-cli-*.tgz
            packages/release/dist/vibase-server-d1-*.tgz
            packages/release/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vibase-release
          path: assets
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -1 assets
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "Draft release $GITHUB_REF_NAME: the two tarballs and SHA256SUMS. Changes: packages/cli/CHANGELOG.md and packages/server-d1/CHANGELOG.md at this tag. Check the tarballs against SHA256SUMS, then publish to npm (server first, then client) and publish this release by hand."
